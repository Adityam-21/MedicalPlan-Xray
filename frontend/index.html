<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4338ca" />

  <meta name="description"
    content="MedicalPlan-Xray: an educational demo that suggests a Low, Medium or High insurance plan tier from a household profile, and shows the decision thresholds behind it. React, FastAPI and a scikit-learn decision tree." />

  <meta name="keywords"
    content="Machine Learning, insurance plan tier, decision tree, scikit-learn, FastAPI, React, model card, interpretable ML" />

  <meta name="author" content="Kumar Adityam" />

  <meta property="og:title" content="MedicalPlan-Xray" />
  <meta property="og:description"
    content="Which insurance plan tier fits this household profile, and why — an interpretable ML demo." />
  <meta property="og:type" content="website" />

  <link rel="icon" type="image/png" href="/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <title>MedicalPlan-Xray — insurance plan tier, explained</title>
</head>

<body>
  <script>
    // Runs before first paint: applies the saved theme, or the system
    // preference when there is no saved choice, so the page never flashes.
    (function () {
      try {
        var saved = localStorage.getItem("mpx-theme");
        var dark = saved ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch (e) { /* storage blocked: stay light */ }
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
